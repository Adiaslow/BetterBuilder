[package]
name = "bb-embed"
description = "Pure-Rust reimplementation of the RDKit ETKDGv3 macrocycle embed: staged distance-geometry minimization (Stages A/B/C), acceptance checks, and the two-stage core-pin recipe. Consumes a MoleculeSpec; emits conformer coordinates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

# Best-in-class numerics (argmin optimizer, nalgebra, rand); setup comes from bb-rdkit (FFI). No Python.
[dependencies]
bb-core = { path = "../bb-core" }
argmin = "0.10"
argmin-math = { version = "0.4", features = ["vec"] }
rand = "0.8"
rayon = "1"
nalgebra = "0.33"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Diagnostic force-field-eval counter (adds an atomic per eval; off in production/parallel runs).
profile = []

[dev-dependencies]
criterion = "0.5"

[lints]
workspace = true

[[bin]]
name = "bb-embed"
path = "src/bin/embed.rs"

[[bin]]
name = "bb-batch"
path = "src/bin/batch.rs"

[[bench]]
name = "stages"
harness = false
