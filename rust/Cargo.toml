[workspace]
resolver = "2"
members = ["bb-core", "bb-embed", "bb-rdkit", "bb-solv", "bb-py", "bb-perceive", "bb-bounds", "bb-spec", "bb-db2", "bb-output", "bb-strain"]
# bb-py is a PyO3 extension module — built by maturin (which sets the macOS dynamic-lookup link args),
# not by a plain `cargo build`. Excluded from the default build so the engine/guard build is unaffected.
default-members = ["bb-core", "bb-embed", "bb-rdkit", "bb-solv", "bb-perceive", "bb-bounds", "bb-spec", "bb-db2", "bb-output", "bb-strain"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Shoichet Lab"]
publish = false # internal lab tool, not for crates.io

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, so a MoleculeSpec survives its JSON round trip
# exactly (the default parser can be 1 ULP off, enough to change an embed).
serde_json = { version = "1", features = ["float_roundtrip"] }

# Shared lints — deny the sharp edges, keep the hot numeric path pragmatic.
[workspace.lints.clippy]
# A validated numerical port: `x * 2.0` etc. read clearer than `mul_add`, and some casts are deliberate.
too_many_arguments = "allow"
excessive_precision = "allow"

# Portable release tuning (guard-validated fidelity-neutral: median NN 1.260 exact). Fat LTO +
# single codegen unit let the compiler inline the force-field hot path across bb-core/bb-embed.
# CPU-specific vectorization (NEON/AVX FMA) is set separately in .cargo/config.toml (target-cpu),
# since that produces machine-specific binaries. Together they measured ~1.3× on mc0071 (16.4→12.4s).
[profile.release]
lto = "fat"
codegen-units = 1
