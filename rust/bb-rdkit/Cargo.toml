[package]
name = "bb-rdkit"
description = "Setup layer: extracts a MoleculeSpec (bounds matrix, experimental torsions, chiral sets, impropers) from a SMILES via cxx FFI to the patched RDKit C++ build. This is the ~9% of the pipeline borrowed from RDKit; the embed itself is bb-embed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
# Declares this crate links the (external) patched RDKit; re-exports resolved paths (cargo:root/deps)
# to dependents as DEP_RDKITPATCHED_ROOT / DEP_RDKITPATCHED_DEPS.
links = "rdkitpatched"

# FFI to the patched RDKit C++ (2026.09.1pre + Divya's amide torsions) for setup extraction.
# Pure Rust via cxx (best-in-class Rust<->C++); NO Python. Links our from-source patched build.

[dependencies]
cxx = "1"
bb-core = { path = "../bb-core" }
serde_json = { workspace = true }
thiserror = "2"

[build-dependencies]
cxx-build = "1"

[dev-dependencies]
bb-embed = { path = "../bb-embed" }

[[bin]]
name = "bb-spec"
path = "src/bin/spec.rs"

[lints]
workspace = true
