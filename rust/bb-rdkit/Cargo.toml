[package]
name = "bb-rdkit"
description = "Setup layer: extracts a MoleculeSpec (bounds matrix, experimental torsions, chiral sets, impropers) from a SMILES via cxx FFI to the patched RDKit C++ build. This is the ~9% of the pipeline borrowed from RDKit; the embed itself is bb-embed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
# Declares this crate links the (external) patched RDKit; re-exports resolved paths (cargo:root/deps)
# to dependents as DEP_RDKITPATCHED_ROOT / DEP_RDKITPATCHED_DEPS.
links = "rdkitpatched"

# FFI to the patched RDKit C++ (2026.09.1pre + Divya's amide torsions) for setup extraction.
# Pure Rust via cxx (best-in-class Rust<->C++); NO Python. Links our from-source patched build.

[dependencies]
cxx = "1"
bb-core = { path = "../bb-core" }
# bb-spec (native spec) + bb-embed (native force field) are used by the fixture generator bin
# (src/bin/gen_fixtures.rs) and by the parity tests. Neither depends on bb-rdkit, so there is no
# cycle (bb-embed is the RDKit-free pipeline; bb-spec depends only on core/perceive/bounds).
bb-spec = { path = "../bb-spec" }
bb-embed = { path = "../bb-embed" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

[build-dependencies]
cxx-build = "1"

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "bb-spec"
path = "src/bin/spec.rs"

[[bin]]
name = "bb-spec-batch"
path = "src/bin/spec_batch.rs"

[[bin]]
name = "bb-raw-bounds-batch"
path = "src/bin/raw_bounds_batch.rs"

[[bin]]
name = "bb-uff-dump"
path = "src/bin/uff_dump.rs"

[[bin]]
name = "bb-aromaticity-dump"
path = "src/bin/aromaticity_dump.rs"

[lints]
workspace = true
